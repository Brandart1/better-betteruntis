name: CI

# Analyze and test only. Building the app (APK, IPA, web) and deploying the
# Cloudflare Worker happen once, in release.yml, when a version tag is pushed —
# building here as well doubled the billed minutes (macOS counts 10x on private repos).

on:
  push:
    branches: [main, teacher]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.47.9"

jobs:
  test:
    name: Analyze & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter analyze
      - run: flutter test

  worker:
    name: Worker typecheck & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # Branches without worker/ (main before 0.5.0) pass without running it.
      - id: check
        run: |
          if [ -f worker/package.json ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; fi
      - if: steps.check.outputs.present == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
      - name: Test
        if: steps.check.outputs.present == 'true'
        working-directory: worker
        env:
          WRANGLER_SEND_METRICS: "false"
        run: |
          npm install -g npm@11.19.1
          npm ci --strict-allow-scripts
          npx tsc --noEmit
          npx vitest run
