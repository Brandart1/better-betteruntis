name: CI

# Analyze and test only. Building the app (APK, IPA, web + server, Docker
# image) happens once, in release.yml, when a version tag is pushed — building here as well
# doubled the billed minutes (macOS counts 10x on private repos).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.47.9"

jobs:
  test:
    name: Analyze & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter analyze
      - run: flutter test
      - name: Server analyze & test
        working-directory: server
        run: |
          dart pub get
          dart analyze
          dart test
